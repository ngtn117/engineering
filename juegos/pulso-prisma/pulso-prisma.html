<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pulso Prisma</title>
<style>
  :root{--bg:#07040f;--fg:#f2ecff;--neon:#ff3df2;--cyan:#2ef9ff;--lime:#b6ff3b}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:var(--fg);user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box;background:radial-gradient(ellipse at center,rgba(20,6,40,.55),rgba(4,2,10,.88));transition:opacity .25s}
  .ov.hide{opacity:0;pointer-events:none}
  h1{margin:0 0 6px;font-size:clamp(40px,9vw,92px);letter-spacing:.08em;font-weight:900;color:#fff;text-shadow:0 0 8px var(--neon),0 0 24px var(--neon),0 0 60px var(--neon)}
  .sub{color:var(--cyan);letter-spacing:.3em;font-size:clamp(11px,1.6vw,15px);text-shadow:0 0 10px var(--cyan);margin-bottom:28px}
  .keys{display:grid;grid-template-columns:auto auto;gap:8px 18px;font-size:clamp(13px,1.8vw,17px);margin-bottom:28px;text-align:left}
  kbd{display:inline-block;min-width:22px;padding:3px 9px;border:1px solid var(--cyan);border-radius:6px;box-shadow:0 0 8px rgba(46,249,255,.5);color:#fff;font-family:inherit;text-align:center}
  .btn{font-size:clamp(16px,2.4vw,22px);font-weight:800;letter-spacing:.15em;padding:14px 34px;border-radius:12px;border:2px solid var(--lime);color:#fff;background:rgba(182,255,59,.08);box-shadow:0 0 18px rgba(182,255,59,.6),inset 0 0 14px rgba(182,255,59,.3);cursor:pointer;animation:beat .47s ease-in-out infinite alternate}
  @keyframes beat{to{transform:scale(1.06);box-shadow:0 0 32px rgba(182,255,59,.9),inset 0 0 18px rgba(182,255,59,.4)}}
  .best{margin-top:18px;color:#c9b8ff;font-size:14px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-bottom:24px;font-size:13px;color:#d9ccff}
  .legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;border-radius:2px}
  .l1::before{background:#ff3d6e;box-shadow:0 0 8px #ff3d6e}
  .l2::before{background:#2ef9ff;box-shadow:0 0 8px #2ef9ff}
  .l3::before{background:#ffe23d;box-shadow:0 0 8px #ffe23d}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ov" id="menu">
  <h1>PULSO PRISMA</h1>
  <div class="sub">SALTA AL RITMO · NO TOQUES LAS PÚAS</div>
  <div class="keys">
    <span><kbd>Espacio</kbd> <kbd>↑</kbd> o <kbd>Clic</kbd></span><span>Saltar (mantén pulsado para saltar en cadena)</span>
    <span><kbd>P</kbd></span><span>Pausa</span>
    <span><kbd>M</kbd></span><span>Silenciar música</span>
    <span><kbd>R</kbd></span><span>Reiniciar desde cero</span>
  </div>
  <div class="legend">
    <span class="l1">Púas: si las tocas, pierdes</span>
    <span class="l2">Bloques: súbete encima, no choques de lado</span>
    <span class="l3">Trampolín: salto gigante</span>
  </div>
  <button class="btn" id="play">▶ JUGAR</button>
  <div class="best" id="menuBest"></div>
</div>

<div class="ov hide" id="pause">
  <h1 style="font-size:clamp(34px,7vw,70px)">PAUSA</h1>
  <div class="sub">PULSA P PARA SEGUIR</div>
</div>

<script>
(() => {
"use strict";
// ---------- Constantes de mundo ----------
const H = 540;              // alto lógico
const GROUND = 430;         // y del suelo (arriba del suelo)
const S = 40;               // lado del cubo y de las púas
const G = 4300;             // gravedad px/s²
const JUMP = 1160;          // impulso de salto
const PAD = 1520;           // impulso del trampolín
const PX = 230;             // x del jugador en pantalla
const STEP = 1/120;         // paso fijo de física

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let scale = 1, VW = 960, dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  scale = cv.height / H;
  VW = cv.width / scale;
}
addEventListener("resize", resize); resize();

// ---------- Almacenamiento seguro ----------
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
let best = +(store.get("pulsoPrisma.best") || 0);

// ---------- Audio (todo sintetizado, música original) ----------
let ac = null, master = null, musicGain = null, muted = false;
let nextNoteTime = 0, stepIdx = 0;
const beatTimes = [];       // tiempos de bombo para el pulso visual
function initAudio(){
  if (ac) { if (ac.state === "suspended") ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
  musicGain = ac.createGain(); musicGain.gain.value = 0.8; musicGain.connect(master);
  nextNoteTime = ac.currentTime + 0.08;
  setInterval(scheduler, 25);
}
function bpm(){ return Math.min(160, 124 + (phase - 1) * 5); }
// Progresión original en La menor: Am – F – C – G (raíces MIDI)
const CHORDS = [[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const BASS_STEPS = [0,3,6,8,10,11,14];
const ARP = [0,1,2,1,0,2,1,2];
function mtof(m){ return 440 * Math.pow(2,(m-69)/12); }
function scheduler(){
  if (!ac) return;
  while (nextNoteTime < ac.currentTime + 0.12){
    playStep(stepIdx, nextNoteTime);
    nextNoteTime += 60 / bpm() / 4;
    stepIdx = (stepIdx + 1) % 64;
  }
}
function playStep(i, t){
  if (state === "paused" || state === "menu") return;
  const s = i % 16, bar = (i >> 4) % 4, ch = CHORDS[bar];
  if (s % 4 === 0){ kick(t); beatTimes.push(t); }
  if (s === 4 || s === 12) clap(t);
  if (s % 2 === 1 || phase >= 3) hat(t, s % 2 === 1 ? 0.09 : 0.04);
  if (BASS_STEPS.includes(s)) bass(mtof(ch[0] - 12), t, s === 0 ? 0.22 : 0.12);
  if (phase >= 2 && s % 2 === 0) lead(mtof(ch[ARP[(s/2)|0]] + 12), t, 0.1);
  if (phase >= 4 && (s === 7 || s === 15)) lead(mtof(ch[2] + 24), t, 0.08);
}
function env(g, t, a, peak, d){
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function kick(t){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
  env(g, t, 0.003, 0.9, 0.22); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.3);
}
let noiseBuf = null;
function noise(){
  if (noiseBuf) return noiseBuf;
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return noiseBuf;
}
function hat(t, vol){
  const n = ac.createBufferSource(); n.buffer = noise();
  const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 7000;
  const g = ac.createGain(); env(g, t, 0.002, vol, 0.04);
  n.connect(f); f.connect(g); g.connect(musicGain); n.start(t); n.stop(t + 0.08);
}
function clap(t){
  const n = ac.createBufferSource(); n.buffer = noise();
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 0.8;
  const g = ac.createGain(); env(g, t, 0.004, 0.35, 0.14);
  n.connect(f); f.connect(g); g.connect(musicGain); n.start(t); n.stop(t + 0.2);
}
function bass(freq, t, d){
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = "sawtooth"; o.frequency.value = freq;
  f.type = "lowpass"; f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(220, t + d); f.Q.value = 6;
  env(g, t, 0.005, 0.32, d); o.connect(f); f.connect(g); g.connect(musicGain); o.start(t); o.stop(t + d + 0.05);
}
function lead(freq, t, d){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "square"; o.frequency.value = freq;
  env(g, t, 0.004, 0.07, d); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + d + 0.05);
}
function sfx(kind){
  if (!ac || muted) return;
  const t = ac.currentTime;
  if (kind === "crash"){
    const n = ac.createBufferSource(); n.buffer = noise();
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(3000,t); f.frequency.exponentialRampToValueAtTime(120,t+0.5);
    const g = ac.createGain(); env(g, t, 0.003, 0.8, 0.5);
    n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+0.55);
  } else if (kind === "pad"){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(1200,t+0.18);
    env(g, t, 0.004, 0.25, 0.2); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.25);
  } else if (kind === "phase"){
    [0,0.08,0.16].forEach((dt,k)=>{ const o=ac.createOscillator(), g=ac.createGain();
      o.type="square"; o.frequency.value = mtof(76+k*4); env(g,t+dt,0.004,0.08,0.12);
      o.connect(g); g.connect(master); o.start(t+dt); o.stop(t+dt+0.18); });
  }
}
function setMuted(m){ muted = m; if (master) master.gain.value = m ? 0 : 0.55; }

// ---------- Estado de juego ----------
let state = "menu";   // menu | play | dead | paused
let player, obs, parts, trail, worldX, nextX, score, phase, attempts = 0, deadTimer = 0, shake = 0, flash = 0, phaseBanner = 0;
let held = false, buffer = 0, pulse = 0;

function reset(){
  player = { x: 0, y: GROUND - S, vy: 0, onGround: true, rot: 0, prevBottom: GROUND };
  obs = []; parts = []; trail = [];
  worldX = 0; nextX = 900; score = 0; phase = 1; deadTimer = 0; phaseBanner = 1.6;
  attempts++;
}
function speed(){ return 410 + Math.min(phase - 1, 9) * 38; }

// ---------- Generador de patrones (diseñados para que siempre se puedan superar) ----------
function spike(x, y){ obs.push({ t:"spike", x, y: y ?? GROUND - S, w:S, h:S }); }
function block(x, top, w, h){ obs.push({ t:"block", x, y: top, w, h }); }
function pad(x){ obs.push({ t:"pad", x, y: GROUND - 10, w:S, h:10, used:false }); }

const PATTERNS = [
  { min:1, w:()=> (spike(nextX), S) },
  { min:1, w:()=> (spike(nextX), spike(nextX+S), 2*S) },
  { min:2, w:()=> (spike(nextX), spike(nextX+S), spike(nextX+2*S), 3*S) },
  { min:1, w:()=> { block(nextX, GROUND-S, 3*S, S); return 3*S; } },
  { min:2, w:()=> { block(nextX, GROUND-S, 4*S, S); spike(nextX+4*S); spike(nextX+5*S); return 6*S; } },
  { min:2, w:()=> { block(nextX, GROUND-S, 2*S, S); block(nextX+5*S, GROUND-2*S, 3*S, 2*S); return 8*S; } },
  { min:3, w:()=> { block(nextX, GROUND-S, 5*S, S); spike(nextX+4*S, GROUND-2*S); return 5*S; } },
  { min:3, w:()=> { // plataforma flotante sobre un foso de púas
      block(nextX, GROUND-3*S, 6*S, S/2);
      for (let i=1;i<6;i++) spike(nextX+i*S);
      return 6*S; } },
  { min:2, w:()=> { // trampolín + fila de púas, ajustada a la velocidad
      pad(nextX);
      const air = 2*PAD/G, reach = speed()*air;
      const n = Math.max(3, Math.min(8, Math.floor((reach - 2*S - 50) / S)));
      for (let i=0;i<n;i++) spike(nextX + 2*S + i*S);
      return (n+2)*S; } },
  { min:4, w:()=> { spike(nextX); spike(nextX+S); block(nextX+6*S, GROUND-S, 2*S, S); spike(nextX+8*S); return 9*S; } },
  { min:5, w:()=> { // escalera
      block(nextX, GROUND-S, 2*S, S); block(nextX+4*S, GROUND-2*S, 2*S, 2*S); block(nextX+8*S, GROUND-3*S, 2*S, 3*S);
      spike(nextX+10*S); spike(nextX+11*S); return 12*S; } },
];
function generate(){
  const camX = player.x - PX;
  while (nextX < camX + VW + 400){
    const pool = PATTERNS.filter(p => p.min <= phase);
    // en fases altas se prefieren los patrones difíciles
    const pick = Math.random() < Math.min(0.15 * (phase - 1), 0.6) ? pool.slice(-4) : pool;
    const w = pick[(Math.random() * pick.length) | 0].w();
    const v = speed(), air = 2*JUMP/G;
    const minGap = v * air * 0.75 + 60;
    const extra = Math.max(60, 320 - phase * 25);
    nextX += w + minGap + Math.random() * extra;
  }
  // eliminar los que quedaron atrás
  while (obs.length && obs[0].x + obs[0].w < camX - 200) obs.shift();
}

// ---------- Física ----------
function overlap(ax,ay,aw,ah,bx,by,bw,bh){ return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by; }
function die(){
  if (state !== "play") return;
  state = "dead"; deadTimer = 0.9; shake = 14; flash = 1;
  sfx("crash");
  const cx = player.x + S/2, cy = player.y + S/2;
  for (let i=0;i<46;i++){
    const a = Math.random()*Math.PI*2, sp = 120 + Math.random()*520;
    parts.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 150, life:0.7 + Math.random()*0.6, s:3 + Math.random()*7, hue: Math.random()<0.5 ? 310 : 185 });
  }
  if (score > best){ best = score; store.set("pulsoPrisma.best", String(best)); }
}
function physics(dt){
  const p = player;
  p.prevBottom = p.y + S;
  p.x += speed() * dt;
  if (buffer > 0) buffer -= dt;
  if ((held || buffer > 0) && p.onGround){ p.vy = -JUMP; p.onGround = false; buffer = 0; }
  p.vy += G * dt;
  p.y += p.vy * dt;
  p.onGround = false;
  if (p.y + S >= GROUND){ p.y = GROUND - S; p.vy = 0; p.onGround = true; }

  for (const o of obs){
    if (o.x > p.x + S + 4) break;
    if (o.x + o.w < p.x - 4) continue;
    if (o.t === "block"){
      if (overlap(p.x, p.y, S, S, o.x, o.y, o.w, o.h)){
        if (p.vy >= 0 && p.prevBottom <= o.y + 12){ p.y = o.y - S; p.vy = 0; p.onGround = true; }
        else { die(); return; }
      }
    } else if (o.t === "spike"){
      if (overlap(p.x+5, p.y+5, S-10, S-8, o.x+13, o.y+14, o.w-26, o.h-14)){ die(); return; }
    } else if (o.t === "pad"){
      if (overlap(p.x, p.y, S, S, o.x, o.y - 4, o.w, o.h + 4) && p.vy >= 0){
        p.vy = -PAD; p.onGround = false; o.used = 0.4; sfx("pad"); buffer = 0;
      }
    }
  }
  // rotación del cubo
  if (p.onGround){
    const target = Math.round(p.rot / (Math.PI/2)) * (Math.PI/2);
    p.rot += (target - p.rot) * Math.min(1, dt * 25);
  } else p.rot += dt * 9.2;

  score = Math.floor(p.x / S);
  const np = 1 + Math.floor(score / 220);
  if (np !== phase){ phase = np; phaseBanner = 1.6; sfx("phase"); }
}

let acc = 0, last = performance.now();
function frame(now){
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "play"){
    acc += dt;
    while (acc >= STEP && state === "play"){ physics(STEP); acc -= STEP; }
    generate();
    if (Math.random() < 0.9){ trail.push({ x: player.x, y: player.y, rot: player.rot, life: 0.25 }); }
  } else if (state === "dead"){
    deadTimer -= dt;
    if (deadTimer <= 0){ reset(); state = "play"; acc = 0; }
  }
  if (state !== "paused"){
    for (const q of parts){ q.vy += 900*dt; q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt; }
    parts = parts.filter(q => q.life > 0);
    for (const t of trail) t.life -= dt;
    trail = trail.filter(t => t.life > 0);
    shake *= Math.pow(0.002, dt); flash = Math.max(0, flash - dt*2.5); phaseBanner = Math.max(0, phaseBanner - dt);
    for (const o of obs) if (o.used) o.used = Math.max(0, o.used - dt);
  }
  // pulso al ritmo
  if (ac){ while (beatTimes.length && beatTimes[0] <= ac.currentTime){ beatTimes.shift(); pulse = 1; } }
  pulse = Math.max(0, pulse - dt * 4);
  draw();
  requestAnimationFrame(frame);
}

// ---------- Dibujo ----------
function hueFor(ph){ return [300, 190, 265, 140, 25, 330, 210, 50, 170, 0][(ph-1) % 10]; }
function draw(){
  const hue = hueFor(phase), hue2 = (hue + 150) % 360;
  ctx.setTransform(1,0,0,1,0,0);
  // fondo
  const g = ctx.createLinearGradient(0,0,0,cv.height);
  g.addColorStop(0, `hsl(${hue},70%,${7 + pulse*4}%)`);
  g.addColorStop(1, `hsl(${hue2},80%,3%)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,cv.width,cv.height);

  const sx = (Math.random()-0.5)*shake, sy = (Math.random()-0.5)*shake;
  ctx.setTransform(scale,0,0,scale, sx*scale, sy*scale);
  const camX = player.x - PX;

  // sol / anillo pulsante
  ctx.save();
  ctx.globalAlpha = 0.25 + pulse*0.25;
  ctx.strokeStyle = `hsl(${hue2},100%,65%)`; ctx.lineWidth = 3;
  ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 25;
  ctx.beginPath(); ctx.arc(VW*0.72, 190, 90 + pulse*10, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(VW*0.72, 190, 60 + pulse*6, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  // montañas lejanas (parallax)
  ctx.fillStyle = `hsla(${hue},60%,14%,0.9)`;
  ctx.beginPath(); ctx.moveTo(0, GROUND);
  const k0 = Math.floor(camX*0.2/80) - 1;
  for (let k=k0; k<=k0 + VW/80 + 3; k++){
    const h = 50 + ((Math.abs(Math.sin(k*127.1)*43758.5453))%1)*150;
    ctx.lineTo(k*80 - camX*0.2, GROUND - h);
  }
  ctx.lineTo(VW+160, GROUND); ctx.closePath(); ctx.fill();

  // rejilla de fondo
  ctx.strokeStyle = `hsla(${hue2},100%,70%,${0.07 + pulse*0.06})`; ctx.lineWidth = 1;
  const gs = 60, off = -(camX*0.5 % gs);
  ctx.beginPath();
  for (let x=off; x<VW; x+=gs){ ctx.moveTo(x,0); ctx.lineTo(x,GROUND); }
  for (let y=30; y<GROUND; y+=gs){ ctx.moveTo(0,y); ctx.lineTo(VW,y); }
  ctx.stroke();

  // suelo
  ctx.fillStyle = `hsl(${hue},60%,6%)`; ctx.fillRect(0, GROUND, VW, H-GROUND);
  ctx.strokeStyle = `hsla(${hue},100%,60%,0.25)`;
  ctx.beginPath();
  const goff = -(camX % S);
  for (let x=goff; x<VW; x+=S){ ctx.moveTo(x, GROUND); ctx.lineTo(x - 30, H); }
  ctx.stroke();
  ctx.save();
  ctx.strokeStyle = `hsl(${hue},100%,70%)`; ctx.lineWidth = 3; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 18 + pulse*14;
  ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(VW, GROUND); ctx.stroke();
  ctx.restore();

  // obstáculos
  ctx.save(); ctx.translate(-camX, 0);
  for (const o of obs){
    if (o.x > camX + VW + 50 || o.x + o.w < camX - 50) continue;
    if (o.t === "spike"){
      ctx.fillStyle = "#1a0510"; ctx.strokeStyle = "#ff3d6e"; ctx.lineWidth = 2.5;
      ctx.shadowColor = "#ff3d6e"; ctx.shadowBlur = 14 + pulse*10;
      ctx.beginPath(); ctx.moveTo(o.x+2, o.y+o.h); ctx.lineTo(o.x+o.w/2, o.y+2); ctx.lineTo(o.x+o.w-2, o.y+o.h); ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else if (o.t === "block"){
      ctx.fillStyle = `hsla(185,90%,12%,0.95)`; ctx.strokeStyle = "#2ef9ff"; ctx.lineWidth = 2.5;
      ctx.shadowColor = "#2ef9ff"; ctx.shadowBlur = 12 + pulse*8;
      ctx.fillRect(o.x, o.y, o.w, o.h); ctx.strokeRect(o.x+1, o.y+1, o.w-2, o.h-2);
      ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(46,249,255,.25)"; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x=o.x+S; x<o.x+o.w-1; x+=S){ ctx.moveTo(x,o.y); ctx.lineTo(x,o.y+o.h); }
      for (let y=o.y+S; y<o.y+o.h-1; y+=S){ ctx.moveTo(o.x,y); ctx.lineTo(o.x+o.w,y); }
      ctx.stroke();
    } else if (o.t === "pad"){
      const k = o.used ? o.used/0.4 : 0;
      ctx.fillStyle = "#ffe23d"; ctx.shadowColor = "#ffe23d"; ctx.shadowBlur = 18 + k*25;
      ctx.beginPath(); ctx.ellipse(o.x+o.w/2, o.y+o.h, o.w/2, o.h + k*6, 0, Math.PI, 0); ctx.fill();
      ctx.globalAlpha = 0.35 + pulse*0.3;
      ctx.beginPath(); ctx.moveTo(o.x+8, o.y-8); ctx.lineTo(o.x+o.w/2, o.y-22); ctx.lineTo(o.x+o.w-8, o.y-8); ctx.strokeStyle="#ffe23d"; ctx.lineWidth=3; ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  ctx.shadowBlur = 0;

  // estela
  for (const t of trail){
    ctx.globalAlpha = t.life * 1.6;
    ctx.fillStyle = `hsl(${hue2},100%,60%)`;
    const sz = S * (0.35 + t.life*1.6);
    ctx.fillRect(t.x + S/2 - sz/2 - 6, t.y + S/2 - sz/2, sz*0.5, sz*0.5);
  }
  ctx.globalAlpha = 1;

  // jugador
  if (state !== "dead"){
    const p = player;
    ctx.save();
    ctx.translate(p.x + S/2, p.y + S/2); ctx.rotate(p.rot);
    const bump = 1 + pulse*0.06;
    ctx.scale(bump, bump);
    ctx.shadowColor = "#ff3df2"; ctx.shadowBlur = 22 + pulse*16;
    ctx.fillStyle = "#2a0830"; ctx.fillRect(-S/2, -S/2, S, S);
    ctx.strokeStyle = "#ff3df2"; ctx.lineWidth = 3; ctx.strokeRect(-S/2+1.5, -S/2+1.5, S-3, S-3);
    ctx.shadowBlur = 10;
    // cara: prisma interior
    ctx.fillStyle = "#2ef9ff"; ctx.shadowColor = "#2ef9ff";
    ctx.beginPath(); ctx.moveTo(0,-11); ctx.lineTo(11,0); ctx.lineTo(0,11); ctx.lineTo(-11,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.shadowBlur = 0;
    ctx.fillRect(-3,-3,6,6);
    ctx.restore();
  }
  // partículas
  for (const q of parts){
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life));
    ctx.fillStyle = `hsl(${q.hue},100%,65%)`;
    ctx.fillRect(q.x - q.s/2, q.y - q.s/2, q.s, q.s);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.textBaseline = "top";
  ctx.font = "800 30px 'Segoe UI',system-ui,sans-serif";
  ctx.fillStyle = "#fff"; ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.shadowBlur = 14;
  ctx.textAlign = "left"; ctx.fillText(String(score), 22, 16);
  ctx.font = "600 13px 'Segoe UI',system-ui,sans-serif"; ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(230,220,255,.75)";
  ctx.fillText("PUNTOS", 24, 50);
  ctx.textAlign = "right";
  ctx.fillText(`RÉCORD ${Math.max(best, score)}   ·   FASE ${phase}   ·   INTENTO ${attempts}`, VW - 22, 20);
  ctx.fillText(muted ? "♪ silenciado (M)" : "♪ M para silenciar", VW - 22, 40);

  // barra de progreso hacia la siguiente fase
  const prog = (score % 220) / 220;
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(VW/2 - 150, 22, 300, 6);
  ctx.fillStyle = `hsl(${hue2},100%,65%)`; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
  ctx.fillRect(VW/2 - 150, 22, 300*prog, 6); ctx.shadowBlur = 0;

  if (phaseBanner > 0 && state === "play"){
    ctx.globalAlpha = Math.min(1, phaseBanner);
    ctx.textAlign = "center"; ctx.font = "900 44px 'Segoe UI',system-ui,sans-serif";
    ctx.fillStyle = "#fff"; ctx.shadowColor = `hsl(${hue2},100%,60%)`; ctx.shadowBlur = 24;
    ctx.fillText(`FASE ${phase}`, VW/2, 120);
    ctx.font = "600 15px 'Segoe UI',system-ui,sans-serif"; ctx.shadowBlur = 0;
    ctx.fillText(phase === 1 ? "¡Salta con Espacio o clic!" : "Más rápido · más ritmo", VW/2, 172);
    ctx.globalAlpha = 1;
  }
  if (state === "dead"){
    ctx.textAlign = "center"; ctx.font = "900 50px 'Segoe UI',system-ui,sans-serif";
    ctx.fillStyle = "#fff"; ctx.shadowColor = "#ff3d6e"; ctx.shadowBlur = 30;
    ctx.fillText("¡CHOQUE!", VW/2, 150);
    ctx.font = "600 17px 'Segoe UI',system-ui,sans-serif"; ctx.shadowBlur = 0;
    ctx.fillText(score >= best && score > 0 ? `¡Nuevo récord: ${score}!` : `Puntos: ${score}  ·  Récord: ${best}`, VW/2, 210);
  }
  if (flash > 0){ ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = `rgba(255,255,255,${flash*0.35})`; ctx.fillRect(0,0,cv.width,cv.height); }
}

// ---------- Entrada ----------
const menu = document.getElementById("menu"), pauseOv = document.getElementById("pause");
function updateMenuBest(){ document.getElementById("menuBest").textContent = best ? `Tu récord: ${best} puntos` : ""; }
function start(){
  initAudio();
  menu.classList.add("hide");
  attempts = 0; reset(); state = "play"; acc = 0;
}
function press(){
  if (state === "menu"){ start(); return; }
  if (state === "paused") return;
  held = true; buffer = 0.12;
}
function release(){ held = false; }
function togglePause(){
  if (state === "play"){ state = "paused"; pauseOv.classList.remove("hide"); if (ac) ac.suspend(); }
  else if (state === "paused"){ state = "play"; pauseOv.classList.add("hide"); last = performance.now(); acc = 0; if (ac) ac.resume(); }
}
addEventListener("keydown", e => {
  if (["Space","ArrowUp","KeyW"].includes(e.code)){ e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === "KeyP" || e.code === "Escape"){ if (state !== "menu") togglePause(); }
  else if (e.code === "KeyM"){ setMuted(!muted); }
  else if (e.code === "KeyR"){ if (state === "play" || state === "dead"){ attempts = 0; reset(); state = "play"; } }
  else if (e.code === "Enter" && state === "menu"){ start(); }
});
addEventListener("keyup", e => { if (["Space","ArrowUp","KeyW"].includes(e.code)) release(); });
cv.addEventListener("pointerdown", e => { e.preventDefault(); press(); });
addEventListener("pointerup", release);
addEventListener("pointercancel", release);
addEventListener("blur", () => { held = false; if (state === "play") togglePause(); });
document.getElementById("play").addEventListener("click", e => { e.stopPropagation(); start(); });

updateMenuBest();
reset(); attempts = 0; state = "menu";
requestAnimationFrame(frame);
// gancho de pruebas
window.__pp = { get state(){ return state; }, get score(){ return score; }, get phase(){ return phase; }, get attempts(){ return attempts; }, press, release };
})();
</script>
